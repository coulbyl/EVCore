name: evcore

services:
  postgres:
    image: postgres:18-alpine
    container_name: evcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evcore}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-evcore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: evcore-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # redisinsight:
  #   image: redis/redisinsight:latest
  #   container_name: evcore-redisinsight
  #   restart: unless-stopped
  #   ports:
  #     - "${REDISINSIGHT_PORT:-5540}:5540"
  #   depends_on:
  #     redis:
  #       condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: evcore-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-evcore}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      MAX_PREPARED_STATEMENTS: "100"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
    ports:
      - "${PGBOUNCER_PORT:-5433}:5432"
    depends_on:
      postgres:
        condition: service_healthy

  ml-worker:
    build:
      context: ./apps/ml-worker
      dockerfile: Dockerfile
    container_name: evcore-ml-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-evcore}"
      PGBOUNCER_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:5432/${POSTGRES_DB:-evcore}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LOG_LEVEL: info
    ports:
      - "8001:8000"
    volumes:
      - ml_models:/app/models
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  # Opt-in (`docker compose --profile vantage up -d vantage-worker`), not
  # started by a bare `docker compose up` — GROQ_API_KEY is required, and
  # most dev work on this repo doesn't need VANTAGE running. See
  # apps/vantage-worker/README.md; `pnpm --filter vantage-worker dev`
  # remains the simpler local loop (connects to this compose's postgres/redis
  # directly, no image build needed).
  vantage-worker:
    profiles: ["vantage"]
    build:
      context: .
      dockerfile: apps/vantage-worker/Dockerfile
    container_name: evcore-vantage-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-evcore}"
      PGBOUNCER_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:5432/${POSTGRES_DB:-evcore}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Soft default (not `:?required`) — a required var here would fail
      # `docker compose up`/`config` for EVERY service in this file, not just
      # this profile-gated one, since Compose interpolates all services'
      # variables up front regardless of which profiles actually start. An
      # unset key fails loudly instead, inside the container, only when
      # someone actually runs `--profile vantage up`.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      LOG_LEVEL: info
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: evcore-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # S3-compatible object storage for support chat attachments (voice notes,
  # photos, files) — see apps/backend/src/modules/storage and
  # docs/support-attachments-architecture.md. Backend and browser both reach
  # it at RUSTFS_ENDPOINT (dev: same host-published port, no
  # RUSTFS_PUBLIC_ENDPOINT override needed — see .env.example).
  rustfs:
    image: rustfs/rustfs:latest
    container_name: evcore-rustfs
    restart: unless-stopped
    environment:
      # Dev-only defaults — never use these in production (see
      # docker-compose.prod.yml, where they're required with no fallback).
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-evcore_dev_access}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-evcore_dev_secret_change_me}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_S3_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  ml_models:
  rustfs_data:
