# No `name:` here — the compose project name must stay the directory-derived
# default ("evcore", from /opt/apps/evcore) to match the containers already
# running on the server. Setting it explicitly makes Compose treat every
# existing container as belonging to a different project and refuse to
# recreate them (name conflict on the fixed container_name).
#
# Image built and pushed to GHCR by GitHub Actions (workflows/deploy.yml).
# The VPS only pulls and runs — no build step on the server.
# GHCR_OWNER and every secret below go in the server's .env file.

services:
  postgres:
    image: postgres:18-alpine
    container_name: evcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evcore}
      POSTGRES_USER: ${POSTGRES_USER:-evcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/pgdata
    networks:
      - evcore_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evcore} -d ${POSTGRES_DB:-evcore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: evcore-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - evcore_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: evcore-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evcore}"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      MAX_PREPARED_STATEMENTS: "200"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
    networks:
      - evcore_internal
    depends_on:
      postgres:
        condition: service_healthy

  ml-worker:
    container_name: evcore-ml-worker
    image: ghcr.io/${GHCR_OWNER}/evcore-ml-worker:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evcore}
      PGBOUNCER_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-evcore}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: info
    volumes:
      - ml_models:/app/models
    networks:
      - evcore_internal
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  # apps/vantage-worker — 20th channel, LLM-derived pick. Postgres+Redis only,
  # never on the backend/web request path. See apps/vantage-worker/README.md.
  vantage-worker:
    container_name: evcore-vantage-worker
    image: ghcr.io/${GHCR_OWNER}/evcore-vantage-worker:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evcore}
      PGBOUNCER_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-evcore}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      TOGETHER_MODEL: ${TOGETHER_MODEL:-openai/gpt-oss-120b}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-accounts/fireworks/models/gpt-oss-120b}
      LLM_PROVIDER_FALLBACKS: ${LLM_PROVIDER_FALLBACKS:-}
      LOG_LEVEL: info
      SWEEP_INTERVAL_MS: ${VANTAGE_SWEEP_INTERVAL_MS:-300000}
      VANTAGE_COMPETITION_CODES: ${VANTAGE_COMPETITION_CODES:-}
      VANTAGE_ENABLE_RESEARCH: ${VANTAGE_ENABLE_RESEARCH:-false}
      VANTAGE_RESEARCH_PROVIDER: ${VANTAGE_RESEARCH_PROVIDER:-groq}
      GROQ_RESEARCH_MODEL: ${GROQ_RESEARCH_MODEL:-groq/compound-mini}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      VANTAGE_RESEARCH_COMPETITION_CODES: ${VANTAGE_RESEARCH_COMPETITION_CODES:-}
    networks:
      - evcore_internal
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  # S3-compatible attachment storage (support chat). Reachable internally at
  # rustfs:9000 (backend's own admin calls); presigned URLs handed to
  # browsers use RUSTFS_PUBLIC_ENDPOINT (server .env) — a public HTTPS host
  # that coulby_studio_net's reverse proxy forwards here unmodified (no path
  # rewrite, query string intact, or the signature breaks).
  rustfs:
    container_name: evcore-rustfs
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "false"
    expose:
      - "9000"
    volumes:
      - rustfs_data:/data
    networks:
      - evcore_internal
      - coulby_studio_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    container_name: evcore-backend
    image: ghcr.io/${GHCR_OWNER}/evcore-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evcore}
      PGBOUNCER_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-evcore}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-evcore-support}
    expose:
      - "3000"
    networks:
      - evcore_internal
      - coulby_studio_net
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    container_name: evcore-web
    image: ghcr.io/${GHCR_OWNER}/evcore-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    expose:
      - "3000"
    networks:
      - evcore_internal
      - coulby_studio_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  ml_models:
  rustfs_data:

networks:
  evcore_internal:
    name: evcore_internal
    driver: bridge

  coulby_studio_net:
    external: true
