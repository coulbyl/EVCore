name: evcore-prod

# ── Usage ────────────────────────────────────────────────────────────────────
# Image built and pushed to GHCR by GitHub Actions (workflows/deploy.yml).
# The VPS only pulls and runs — no build step on the server.
#
# 1. Copy apps/backend/.env.example → .env and fill values
# 2. Start all services (migrations run automatically on backend startup):
#      docker compose -f docker-compose.prod.yml up -d
# 3. After a new push to main: GitHub Actions handles pull + restart automatically
# ─────────────────────────────────────────────────────────────────────────────
#
# GHCR_OWNER: GitHub username or org (e.g. "myuser")
# Set it in the .env file on the server: GHCR_OWNER=myuser

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: evcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evcore}
      POSTGRES_USER: ${POSTGRES_USER:-evcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/pgdata
    # Not exposed to host — backend accesses via internal Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evcore} -d ${POSTGRES_DB:-evcore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: evcore-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    # Not exposed to host — backend accesses via internal Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── PgBouncer ───────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: evcore-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evcore}"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      MAX_PREPARED_STATEMENTS: "200"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
    # Not exposed to host — backend and ml-worker access via internal network
    depends_on:
      postgres:
        condition: service_healthy

  # ── ML Worker ───────────────────────────────────────────────────────────────
  ml-worker:
    container_name: evcore-ml-worker
    image: ghcr.io/${GHCR_OWNER}/evcore-ml-worker:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evcore}
      PGBOUNCER_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-evcore}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: info
    volumes:
      - ml_models:/app/models
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  # ── VANTAGE Worker ──────────────────────────────────────────────────────────
  # EVCore's 20th channel (apps/vantage-worker) — reads the other channels'
  # decisions and proposes its own LLM-derived pick. Never on the backend/web
  # request path; only needs Postgres + Redis. LLM_PROVIDER, its matching
  # *_API_KEY, and the other VANTAGE_* vars below go in the same server .env
  # as the rest of this file's secrets — see apps/vantage-worker/README.md
  # and apps/vantage-worker/docs/architecture.md for what each one does and
  # costs.
  vantage-worker:
    container_name: evcore-vantage-worker
    image: ghcr.io/${GHCR_OWNER}/evcore-vantage-worker:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evcore}
      PGBOUNCER_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-evcore}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Which provider serves the verdict call — all four are OpenAI-
      # compatible, so this is the only line to change to switch (plus that
      # provider's API key below). Compose can't make a key conditionally
      # required on another var's value, so only the *selected* provider's
      # key is actually enforced — by the app itself at startup (see
      # apps/vantage-worker/src/config.ts) — not by this file. Cerebras is
      # the recommended fallback when Groq's shared 8000 TPM on-demand tier
      # is rate-limiting every sweep (see docs/architecture.md — Cost).
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      TOGETHER_MODEL: ${TOGETHER_MODEL:-openai/gpt-oss-120b}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-accounts/fireworks/models/gpt-oss-120b}
      LOG_LEVEL: info
      SWEEP_INTERVAL_MS: ${VANTAGE_SWEEP_INTERVAL_MS:-300000}
      # Empty = every active competition (the agreed rollout — see
      # docs/architecture.md, Cost: ~$1/month even at full volume).
      VANTAGE_COMPETITION_CODES: ${VANTAGE_COMPETITION_CODES:-}
      # OFF by default — turning this on changes the cost picture
      # meaningfully (per-request search fee, not per-token). Read
      # docs/architecture.md's Situational research section before
      # setting this to true on the server.
      VANTAGE_ENABLE_RESEARCH: ${VANTAGE_ENABLE_RESEARCH:-false}
      GROQ_RESEARCH_MODEL: ${GROQ_RESEARCH_MODEL:-groq/compound-mini}
      # Empty = the built-in "grands championnats" default (PL, LL, BL1, SA,
      # L1, UCL, UEL, UECL) — never "every league", unlike the var above.
      VANTAGE_RESEARCH_COMPETITION_CODES: ${VANTAGE_RESEARCH_COMPETITION_CODES:-}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  # ── Backend ─────────────────────────────────────────────────────────────────
  # entrypoint.sh runs prisma migrate deploy then starts the NestJS app
  backend:
    container_name: evcore-backend
    image: ghcr.io/${GHCR_OWNER}/evcore-backend:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Direct connection — Prisma migrations (DDL incompatible with PgBouncer transaction mode)
      DATABASE_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evcore}
      # PgBouncer — app runtime connection pooling
      PGBOUNCER_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-evcore}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Web (Next.js dashboard) ─────────────────────────────────────────────────
  web:
    container_name: evcore-web
    image: ghcr.io/${GHCR_OWNER}/evcore-web:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Backend API URL reachable from the browser (public-facing)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  ml_models:
