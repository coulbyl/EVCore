# Project name comes from the directory (/opt/apps/evcore): never set `name:`,
# the running containers would conflict. The .env holds secrets and addresses
# only; everything else is in the admin (Réglages).

x-data-env: &data-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evcore}
  PGBOUNCER_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-evcore}
  DATABASE_POOL_MAX: 18
  REDIS_HOST: redis
  REDIS_PORT: 6379

services:
  postgres:
    image: postgres:18-alpine
    container_name: evcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evcore}
      POSTGRES_USER: ${POSTGRES_USER:-evcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/pgdata
    networks:
      - evcore_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evcore} -d ${POSTGRES_DB:-evcore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: evcore-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - evcore_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: evcore-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evcore}"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      MAX_PREPARED_STATEMENTS: "200"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
    networks:
      - evcore_internal
    depends_on:
      postgres:
        condition: service_healthy

  vantage-worker:
    container_name: evcore-vantage-worker
    image: ghcr.io/coulbyl/evcore-vantage-worker:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *data-env
    networks:
      - evcore_internal
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  rustfs:
    container_name: evcore-rustfs
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "false"
    expose:
      - "9000"
    volumes:
      - rustfs_data:/data
    networks:
      - evcore_internal
      - coulby_studio_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    container_name: evcore-backend
    image: ghcr.io/coulbyl/evcore-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *data-env
      NODE_ENV: production
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-evcore-support}
    expose:
      - "3000"
    networks:
      - evcore_internal
      - coulby_studio_net
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    container_name: evcore-web
    image: ghcr.io/coulbyl/evcore-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - evcore_internal
      - coulby_studio_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  rustfs_data:

networks:
  evcore_internal:
    name: evcore_internal
    driver: bridge

  coulby_studio_net:
    external: true
