# No `name:` here — the compose project name must stay the directory-derived
# default ("evcore", from /opt/apps/evcore) to match the containers already
# running on the server. Setting it explicitly makes Compose treat every
# existing container as belonging to a different project and refuse to
# recreate them (name conflict on the fixed container_name).
#
# Image built and pushed to GHCR by GitHub Actions (workflows/deploy.yml).
# The VPS only pulls and runs — no build step on the server. The web's API
# address is fixed in its image at build time (deploy.yml, secret
# NEXT_PUBLIC_API_URL): Next.js inlines it, a runtime value is never read.
#
# The server's .env holds secrets and addresses only (ENV-PROD § 6). Service
# keys and the LLM chain are set in the admin, Réglages › Intégrations /
# Réglages; a variable left in the .env still serves while its field there is
# empty.

# The stack's own addresses, the same for every service that reads the data.
x-data-env: &data-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evcore}
  PGBOUNCER_URL: postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-evcore}
  # Prisma's pool per process, under pgbouncer's DEFAULT_POOL_SIZE (25).
  DATABASE_POOL_MAX: 18
  REDIS_HOST: redis
  REDIS_PORT: 6379

services:
  postgres:
    image: postgres:18-alpine
    container_name: evcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evcore}
      POSTGRES_USER: ${POSTGRES_USER:-evcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/pgdata
    networks:
      - evcore_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evcore} -d ${POSTGRES_DB:-evcore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: evcore-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - evcore_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: evcore-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-evcore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evcore}"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      MAX_PREPARED_STATEMENTS: "200"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
    networks:
      - evcore_internal
    depends_on:
      postgres:
        condition: service_healthy

  # apps/vantage-worker — the LLM's coupon and opinions. Postgres + Redis only,
  # never on the backend/web request path. See apps/vantage-worker/README.md.
  # Reads the same .env as the backend (SETTINGS_ENCRYPTION_KEY, and the LLM
  # keys while Réglages › Intégrations has none).
  vantage-worker:
    container_name: evcore-vantage-worker
    image: ghcr.io/coulbyl/evcore-vantage-worker:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *data-env
    networks:
      - evcore_internal
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  # S3-compatible attachment storage (support chat). Reachable internally at
  # rustfs:9000 (backend's own admin calls); presigned URLs handed to
  # browsers use RUSTFS_PUBLIC_ENDPOINT (server .env) — a public HTTPS host
  # that coulby_studio_net's reverse proxy forwards here unmodified (no path
  # rewrite, query string intact, or the signature breaks).
  rustfs:
    container_name: evcore-rustfs
    # Pinned: `latest` moved under us at each pull. 1.0.4 is the latest
    # release (25/10), the one a deploy has been pulling since.
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "false"
    expose:
      - "9000"
    volumes:
      - rustfs_data:/data
    networks:
      - evcore_internal
      - coulby_studio_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    container_name: evcore-backend
    image: ghcr.io/coulbyl/evcore-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *data-env
      NODE_ENV: production
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-evcore-support}
    expose:
      - "3000"
    networks:
      - evcore_internal
      - coulby_studio_net
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    container_name: evcore-web
    image: ghcr.io/coulbyl/evcore-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server renders reach the backend on the Docker network, not through
      # the public proxy (lib/api/server-api.ts). The topology, not a secret.
      API_INTERNAL_URL: http://backend:3000
    expose:
      - "3000"
    networks:
      - evcore_internal
      - coulby_studio_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  rustfs_data:

networks:
  evcore_internal:
    name: evcore_internal
    driver: bridge

  coulby_studio_net:
    external: true
