name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A pull request that adds a dependency with a known high advisory, or
  # under a licence we cannot ship, is stopped before it is merged.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Review the dependencies this pull request changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  analysis-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate analysis skills and offline calculations
        run: python3 scripts/validate-analysis-skills.py

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # prisma.config.ts calls env("DATABASE_URL") during `prisma generate`.
      # No actual DB connection is made — a placeholder URL is enough for CI.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/evcore
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # What ships in an image: a high or critical advisory blocks. The dev
      # tooling is watched by Dependabot and the image scan (deploy.yml).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (backend)
        run: pnpm --filter backend test

      - name: Test (vantage-worker)
        run: pnpm --filter vantage-worker test

  # Budgets Lighthouse des écrans joueur et de la landing
  # (docs/refonte-ui/16-performance-et-qualite.md § 2), bloquants avant une PR.
  web-budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_API_URL est figé au build : il vise le faux backend des
      # tests e2e, que le script lance sur ce port.
      - name: Build (web, against the e2e mock backend)
        run: pnpm turbo run build --filter=web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3098

      # Chrome est préinstallé sur les runners ubuntu-latest.
      - name: Lighthouse budgets
        run: pnpm turbo run budgets --filter=web

  ml-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ml-worker
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Matches apps/ml-worker/Dockerfile (python:3.12-slim).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/ml-worker/requirements.txt
            apps/ml-worker/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test (ml-worker)
        run: python -m pytest
