version: 2
updates:
  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"

  # --- npm / pnpm workspace (lockfile unique à la racine) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
          - "rxjs"
          - "reflect-metadata"
      nextjs:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "supertest"
          - "@types/supertest"
      tooling:
        patterns:
          - "typescript"
          - "eslint"
          - "@typescript-eslint/*"
          - "prettier"
          - "turbo"
      bullmq:
        patterns:
          - "bullmq"
          - "ioredis"
    ignore:
      # TypeScript 7 retire `moduleResolution: node` (cinq tsconfig du dépôt)
      # et typescript-eslint n'accepte que TypeScript < 6.1 (vérifié le
      # 2026-10-11 : typescript-eslint 8.71 → peer `typescript >=4.8.4 <6.1.0`).
      # À lever quand typescript-eslint publiera le support de TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 casse eslint-plugin-react 7.37 (`context.getFilename` retiré,
      # « contextOrFilename.getFilename is not a function » au chargement de
      # react/display-name) ; le plugin ne déclare qu'ESLint ≤ 9.7. À lever
      # quand eslint-plugin-react supportera ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  # --- Docker (backend) ---
  - package-ecosystem: "docker"
    directory: "/apps/backend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
