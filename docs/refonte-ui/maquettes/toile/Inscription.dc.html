<style>
body{margin:0;font-family:Barlow,system-ui,sans-serif;color:#141821}
a{color:#141821}a:hover{color:#0E1320}
.num{font-family:"Barlow Condensed",Barlow,sans-serif;font-variant-numeric:tabular-nums}

.f label{font-size:14px;color:#5B6472}
.f input{height:48px;border-radius:10px;border:1px solid #D9DDE3;padding:0 14px;font-family:Barlow,sans-serif;font-size:16px;background:#fff;color:#141821}

  <header style="background: #0E1320; color: #fff; padding: 52px 16px 14px; display: flex; align-items: center; justify-content: space-between">
    <a href="LandingMobile.dc.html" aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -12px"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M15 6l-6 6 6 6"/></svg></a>

  <form style="margin: 16px; display: flex; flex-direction: column; gap: 16px">
    <div class="f"><label for="prenom">Prénom</label><input id="prenom" type="text" value="Kouassi"></div>
    <div class="f err"><label for="email">E-mail</label><input id="email" type="email" value="kouassi@gmail.com"><small>Cet e-mail a déjà un compte · <a href="Connexion.dc.html" style="color: #C62828; font-weight: 500">Se connecter</a></small></div>
    <div class="f"><label for="mdp">Mot de passe</label><input id="mdp" type="password" value="••••••••••"><small>8 caractères au moins</small></div>

      <label class="ck"><input id="age" type="checkbox" checked>J'ai 18 ans ou plus (21 au Cameroun), ou l'âge légal de mon pays</label>
      <label class="ck"><input id="cgu" type="checkbox">J'accepte les <a href="Inscription.dc.html" style="font-weight: 500">conditions d'utilisation</a></label>

    <button type="button" style="height: 52px; border-radius: 10px; background: #0E1320; color: #fff; border: 0; font-family: Barlow, sans-serif; font-weight: 600; font-size: 17px">Créer mon compte</button>

  </form>

  <p style="margin: auto 16px 20px; text-align: center; font-size: 11px; color: #5B6472">18+ · Parier comporte des risques de perte</p>
