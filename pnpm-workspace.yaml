packages:
  - "apps/*"
  - "packages/*"

# Supply-chain guard (refonte-ui A10b): never resolve a version published less
# than 14 days ago. A compromised release is usually caught and pulled within
# days; waiting costs nothing on a lockfile project.
minimumReleaseAge: 20160

# Let through, at these exact versions only, releases still inside the delay
# (iddia's practice, its 95a390af): NestJS 12.3.2 (27/10), the first to pin
# multer 2.5.0, and Express's body-parser 2.4.0 (22/10) — the fixes of the two
# high advisories that reach production (DoS). Remove each line once past the
# delay (NestJS on 10/11, the others on 05/11): pnpm then accepts it without
# the exception and the lockfile stays the same.
minimumReleaseAgeExclude:
  - "@nestjs/common@12.3.2"
  - "@nestjs/core@12.3.2"
  - "@nestjs/platform-express@12.3.2"
  - "@nestjs/websockets@12.3.2"
  - "@nestjs/platform-socket.io@12.3.2"
  - "@nestjs/testing@12.3.2"
  - multer@2.5.0
  - body-parser@2.4.0

# Narrow security overrides: each one only matches vulnerable versions, so it
# turns into a no-op once the tree moves past them. Remove when audit is clean
# without it.
overrides:
  # vitest and unplugin-swc keep the locked vite 7.3.1 (3 high advisories,
  # fixed in 7.3.7) even on a full refresh. Dev and test only.
  "vite@>=7.0.0 <7.3.7": "7.3.7"

